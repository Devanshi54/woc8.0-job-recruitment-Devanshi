<h2>{{ job.title }}</h2>

<p><strong>Location:</strong> {{ job.location }}</p>
<p><strong>Salary:</strong> {{ job.salary }}</p>
<p><strong>Job Type:</strong> {{ job.job_type }}</p>
<p><strong>Posted On:</strong> {{ job.date_posted }}</p>

<hr>

<p>{{ job.description }}</p>

<a href="{% url 'job_list' %}">Back to Jobs</a>
{% if user == job.employer %}
    <a href="{% url 'edit_job' job.pk %}">Edit</a>
    <a href="{% url 'delete_job' job.pk %}">Delete</a>
{% endif %}
